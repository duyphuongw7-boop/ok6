<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Multi-TF Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        .font-mono { font-family: 'JetBrains+Mono', monospace; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-gray-700 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400 tracking-tight">
                    <i class="fas fa-robot mr-2"></i>ETHUSDT <span class="text-gray-400 font-light text-xl">Multi-TF</span>
                </h1>
                <p id="server-status" class="text-green-500 text-xs mt-1 font-mono">● SYSTEM OPERATIONAL</p>
            </div>
            <div class="flex items-center space-x-4">
                <span id="pos-badge" class="px-4 py-2 rounded-lg text-sm font-bold bg-gray-800 border border-gray-600 transition-all duration-500">
                    Đang kết nối...
                </span>
                <button id="kill-switch" onclick="toggleKillSwitch()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg shadow-xl transition-all active:scale-95">
                    KILL SWITCH
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <p class="text-gray-400 text-xs uppercase font-bold tracking-widest">Tổng Lợi Nhuận (PnL)</p>
                <p id="total-pnl" class="text-2xl font-black mt-1 font-mono">0.0000</p>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <p class="text-gray-400 text-xs uppercase font-bold tracking-widest text-center">Số Lệnh</p>
                <p id="total-trades" class="text-2xl font-black mt-1 text-blue-400 text-center font-mono">0</p>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <p class="text-gray-400 text-xs uppercase font-bold tracking-widest text-center">Tỉ Lệ Thắng</p>
                <p id="win-rate" class="text-2xl font-black mt-1 text-green-400 text-center font-mono">0%</p>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                <p class="text-gray-400 text-xs uppercase font-bold tracking-widest text-center">Profit Factor</p>
                <p id="profit-factor" class="text-2xl font-black mt-1 text-yellow-500 text-center font-mono">0.00</p>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-8">
            
            <div class="bg-gray-800 rounded-2xl overflow-hidden border border-purple-900/50 shadow-2xl">
                <div class="bg-purple-900/20 px-4 py-3 border-b border-purple-900/50 flex justify-between items-center">
                    <span class="font-bold text-purple-400 uppercase tracking-widest">Khung 1 Tuần (1W)</span>
                    <span class="text-[10px] bg-purple-900/50 px-2 py-1 rounded text-purple-300">Trend chính</span>
                </div>
                <div class="p-2" id="tf-1w"></div>
            </div>

            <div class="bg-gray-800 rounded-2xl overflow-hidden border border-blue-900/50 shadow-2xl">
                <div class="bg-blue-900/20 px-4 py-3 border-b border-blue-900/50 flex justify-between items-center">
                    <span class="font-bold text-blue-400 uppercase tracking-widest">Khung 4 Giờ (4H)</span>
                    <span class="text-[10px] bg-blue-900/50 px-2 py-1 rounded text-blue-300">Xu hướng trung hạn</span>
                </div>
                <div class="p-2" id="tf-4h"></div>
            </div>

            <div class="bg-gray-800 rounded-2xl overflow-hidden border border-emerald-900/50 shadow-2xl">
                <div class="bg-emerald-900/20 px-4 py-3 border-b border-emerald-900/50 flex justify-between items-center">
                    <span class="font-bold text-emerald-400 uppercase tracking-widest">Khung 1 Giờ (1H)</span>
                    <span class="text-[10px] bg-emerald-900/50 px-2 py-1 rounded text-emerald-300">Điểm vào lệnh</span>
                </div>
                <div class="p-2" id="tf-1h"></div>
            </div>

        </div>

        <div class="bg-black rounded-xl p-4 shadow-2xl border border-gray-800">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-bold text-gray-500 uppercase tracking-widest"><i class="fas fa-terminal mr-2"></i>Engine Logs</span>
                <div class="flex items-center space-x-2">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <span class="text-[10px] text-green-700 font-mono">Live</span>
                </div>
            </div>
            <div id="logs-container" class="h-64 overflow-y-auto font-mono text-[12px] text-green-500/90 leading-relaxed space-y-1">
                </div>
        </div>
    </div>

    <script>
        const formatNum = (val) => {
            const n = parseFloat(val);
            if (isNaN(n)) return `<span class="text-gray-600">--</span>`;
            const color = n > 0 ? "text-green-400" : n < 0 ? "text-red-400" : "text-gray-500";
            return `<span class="font-mono ${color}">${n.toFixed(5)}</span>`;
        };

        function createTFTable(tfData) {
            if (!tfData) return '<div class="p-8 text-center text-gray-600 italic">Đang đồng bộ dữ liệu...</div>';
            return `
                <table class="w-full text-xs text-left">
                    <thead class="text-gray-500 uppercase border-b border-gray-700">
                        <tr>
                            <th class="py-2 px-2">Indicator</th>
                            <th class="py-2">T-2</th>
                            <th class="py-2">T-1</th>
                            <th class="py-2 text-white bg-white/5 px-1 rounded-t">T0 (Now)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-700/30">
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="py-4 px-2 text-gray-300 font-medium">MACD Hist</td>
                            <td>${formatNum(tfData.macd_t2)}</td>
                            <td>${formatNum(tfData.macd_t1)}</td>
                            <td class="bg-white/5 font-bold border-l border-gray-700">${formatNum(tfData.macd_t0)}</td>
                        </tr>
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="py-4 px-2 text-gray-300 font-medium">Stoch RSI K</td>
                            <td>--</td>
                            <td>${formatNum(tfData.stoch_k_t1)}</td>
                            <td class="bg-white/5 font-bold border-l border-gray-700">${formatNum(tfData.stoch_k_t0)}</td>
                        </tr>
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="py-4 px-2 text-gray-300 font-medium">Stoch RSI D</td>
                            <td>--</td>
                            <td>${formatNum(tfData.stoch_d_t1)}</td>
                            <td class="bg-white/5 font-bold border-l border-gray-700">${formatNum(tfData.stoch_d_t0)}</td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        async function updateDashboard() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                // Cập nhật PnL & Stats
                const pnlEl = document.getElementById('total-pnl');
                pnlEl.innerText = data.total_pnl.toFixed(4) + " USDT";
                pnlEl.className = `text-2xl font-black mt-1 font-mono ${data.total_pnl >= 0 ? 'text-green-400' : 'text-red-500'}`;
                
                document.getElementById('total-trades').innerText = data.total_trades;
                document.getElementById('win-rate').innerText = data.win_rate + "%";
                document.getElementById('profit-factor').innerText = data.profit_factor;

                // Trạng thái vị thế
                const pb = document.getElementById('pos-badge');
                pb.innerText = data.position === 'NONE' ? "NO POSITION" : data.position;
                
                if (data.position === 'LONG') {
                    pb.className = "px-4 py-2 rounded-lg text-sm font-bold border bg-green-900/40 border-green-500 text-green-400 shadow-[0_0_15px_rgba(34,197,94,0.3)]";
                } else if (data.position === 'SHORT') {
                    pb.className = "px-4 py-2 rounded-lg text-sm font-bold border bg-red-900/40 border-red-500 text-red-400 shadow-[0_0_15px_rgba(239,68,68,0.3)]";
                } else {
                    pb.className = "px-4 py-2 rounded-lg text-sm font-bold border bg-gray-800 border-gray-600 text-gray-400";
                }

                // Render Tables (Đã sửa lại key 4h thay vì 6h)
                if (data.indicators) {
                    document.getElementById('tf-1h').innerHTML = createTFTable(data.indicators['1h']);
                    document.getElementById('tf-4h').innerHTML = createTFTable(data.indicators['4h']);
                    document.getElementById('tf-1w').innerHTML = createTFTable(data.indicators['1w']);
                }

                // Logs (Auto-scroll)
                const logBox = document.getElementById('logs-container');
                const isAtBottom = logBox.scrollHeight - logBox.clientHeight <= logBox.scrollTop + 1;
                
                logBox.innerHTML = data.logs.map(l => {
                    const color = l.includes('LỖI') || l.includes('⚠️') ? 'text-yellow-500' : 
                                  l.includes('🚀') || l.includes('🟢') ? 'text-blue-400' : 
                                  l.includes('🔴') ? 'text-red-400' : 'text-green-500/80';
                    return `<div class="${color}">${l}</div>`;
                }).join('');
                
                if (isAtBottom) {
                    logBox.scrollTop = logBox.scrollHeight;
                }

                // Trạng thái Kill Switch
                const ks = document.getElementById('kill-switch');
                if (data.kill_switch_active) {
                    ks.className = "bg-yellow-500 text-black font-black py-2 px-6 rounded-lg animate-pulse ring-4 ring-yellow-500/20";
                    ks.innerText = "⚠️ KILL SWITCH ACTIVE";
                    document.getElementById('server-status').innerText = "● SYSTEM PAUSED BY KILL SWITCH";
                    document.getElementById('server-status').className = "text-yellow-500 text-xs mt-1 font-mono";
                } else {
                    ks.className = "bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg shadow-xl transition-all";
                    ks.innerText = "KILL SWITCH";
                    document.getElementById('server-status').innerText = "● SYSTEM OPERATIONAL";
                    document.getElementById('server-status').className = "text-green-500 text-xs mt-1 font-mono";
                }

            } catch (e) { 
                console.error("Dashboard Update Error:", e);
                document.getElementById('server-status').innerText = "○ CONNECTION LOST";
                document.getElementById('server-status').className = "text-red-500 text-xs mt-1 font-mono";
            }
        }

        async function toggleKillSwitch() {
            const pwd = prompt("🔒 Nhập mật khẩu Kill Switch để xác nhận (Dừng bot và đóng vị thế):");
            if (pwd === null || pwd.trim() === "") return;

            try {
                const response = await fetch('/api/kill-switch', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                const result = await response.json();
                if (!result.success) alert("❌ " + result.message);
                updateDashboard();
            } catch(e) {
                alert("❌ Lỗi kết nối server!");
            }
        }

        // Tần suất cập nhật 1.5 giây để khớp nhịp của bot
        setInterval(updateDashboard, 1500);
        updateDashboard();
    </script>
</body>
</html>
